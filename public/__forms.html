<!--
  Netlify Forms detection file.
  Netlify scans static HTML at build time to register forms. The live React
  waitlist form is client-rendered, so Netlify can't see it directly; this
  hidden static form declares the "waitlist" form and its fields, and the React
  form POSTs to /__forms.html to record each submission. Do not delete.
-->
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <form name="waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>
  </body>
</html>
